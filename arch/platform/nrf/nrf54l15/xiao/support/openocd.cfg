if {[info exists env(OPENOCD_INTERFACE)]} {
	set INTERFACE $env(OPENOCD_INTERFACE)
} else {
	# By default connect over Debug USB port using the CMSIS-DAP interface
	set INTERFACE "cmsis-dap"
}

source [find interface/$INTERFACE.cfg]

set _CHIPNAME nrf54l

# Work-area is a space in RAM used for flash programming, by default use 16 KiB.
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x4000
}

if { [info exists CPUTAPID] } {
	set _CPUTAPID $CPUTAPID
} else {
	set _CPUTAPID 0x6ba02477
}

# Multidrop instance ID should be configurable by FW in TAD TINSTANCE register.
# Writes to the register are ignored due to a silicon erratum.
if { [info exists SWD_INSTANCE_ID] } {
	set _SWD_INSTANCE_ID $SWD_INSTANCE_ID
} else {
	set _SWD_INSTANCE_ID 0
}

transport select swd

swd newdap $_CHIPNAME cpu -expected-id $_CPUTAPID

if { [info exists SWD_MULTIDROP] } {
	dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu -dp-id 0x001c0289 -instance-id $_SWD_INSTANCE_ID
} else {
	dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
}

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num 0

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# Create target for the AUX access port (AUX-AP).
target create $_CHIPNAME.aux mem_ap -dap $_CHIPNAME.dap -ap-num 1

# AUX-AP is accessible only if CSW Prot[0] bit (Data Access) is set
$_CHIPNAME.dap apsel 1
$_CHIPNAME.dap apcsw 0x01000000 0x01000000

# Issue secure bus transactions on the core's AP (clear CSW.HNONSEC).
# A TrustZone secure world marks its flash, RAM and the RRAM controller
# secure; non-secure debugger accesses to them fail or raise SPU/MPC
# violations, and the debugger could not program the device.
$_CHIPNAME.dap apsel 0
$_CHIPNAME.dap apcsw 0x00000000 0x40000000

adapter speed 1000

# Use main processor as default target.
targets $_TARGETNAME

if {![using_hla]} {
	$_TARGETNAME cortex_m reset_config sysresetreq
}

# Program the RRAM by direct memory writes: enable writing with a
# 16-byte write buffer (RRAMC.CONFIG), load, then commit the buffer
# (RRAMC.TASKS_COMMITWRITEBUF) -- without the commit the last, partial
# buffer line of an image is never written -- and disable writing again.
proc nrf54l-load {file} {
	mww 0x5004b500 0x101
	load_image $file
	mww 0x5004b008 1
	sleep 10
	mww 0x5004b500 0x0
}

# Reset through a *secure* SYSRESETREQ. A TrustZone secure world sets
# AIRCR.SYSRESETREQS, after which reset requests are honoured only from
# the secure register bank; DSCSR.SBRSEL selects that bank for debugger
# accesses. Harmless for firmware without TrustZone.
proc nrf54l-reset {} {
	mww 0xE000EE08 0x00000003
	mww 0xE000ED0C 0x05FA0004
	sleep 100
}

# Reset as above but halt at the reset vector (DEMCR.VC_CORERESET), so
# the image can be verified with the core stopped before any firmware
# has set up TrustZone memory protection, which would make OpenOCD's
# on-target verification fault. nrf54l-run releases the core.
proc nrf54l-reset-halt {} {
	mww 0xE000EDFC 0x01000001
	nrf54l-reset
	halt
}

proc nrf54l-run {} {
	mww 0xE000EDFC 0x01000000
	resume
}
